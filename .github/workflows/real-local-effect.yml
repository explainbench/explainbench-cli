name: Real local-effect validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-local-effect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPLAINBENCH_RUN_REAL_LOCAL_EFFECT: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Install the wheel in an isolated environment
        run: |
          uv venv --python 3.12 .real-wheel-venv
          uv pip install \
            --python .real-wheel-venv/bin/python \
            dist/explain_bench-*.whl \
            "pytest>=8.4,<10"

      - name: Show Docker information
        run: docker info

      - name: Prepare a run directory outside the repository
        env:
          EXPLAINBENCH_REAL_RUN_ROOT: >-
            ${{ runner.temp }}/explainbench-real-wheel-run
        run: |
          mkdir -p \
            "${EXPLAINBENCH_REAL_RUN_ROOT}/examples" \
            "${EXPLAINBENCH_REAL_RUN_ROOT}/tests/real_local_effect"
          cp \
            examples/submission-full.json \
            "${EXPLAINBENCH_REAL_RUN_ROOT}/examples/submission-full.json"
          cp \
            tests/real_local_effect/test_s01_s07_real_pipeline.py \
            "${EXPLAINBENCH_REAL_RUN_ROOT}/tests/real_local_effect/"

      - name: Run real unpaid local-effect tests
        env:
          EXPLAINBENCH_REAL_EXECUTABLE: >-
            ${{ github.workspace }}/.real-wheel-venv/bin/explainbench
          EXPLAINBENCH_REAL_RUN_ROOT: >-
            ${{ runner.temp }}/explainbench-real-wheel-run
          PYTHONNOUSERSITE: "1"
        run: |
          cd "${EXPLAINBENCH_REAL_RUN_ROOT}"
          env -u PYTHONPATH \
            "${{ github.workspace }}/.real-wheel-venv/bin/python" \
            -P -m pytest \
            -p no:tracer_plugin \
            -o "markers=real_local_effect: real SWE-bench execution tests" \
            tests/real_local_effect \
            -ra
